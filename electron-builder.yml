appId: com.example.kotodama
productName: Kotodama
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
mac:
  # 自己署名証明書。署名要件が証明書に固定されるので、再ビルドしても macOS の許可が外れない。
  # 「-」は証明書名の部分一致になり、別の証明書が選ばれる。CI は --config.mac.identity=- で ad-hoc にする。
  identity: "Kotodama Local Signing"
  forceCodeSigning: true
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleDisplayName: Kotodama
    NSMicrophoneUsageDescription: 音声入力のためマイクを使用します
    NSAppleEventsUsageDescription: 文字をカーソル位置に貼り付けるためにキー操作を送出します
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
