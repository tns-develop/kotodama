appId: com.example.kotodama
productName: Kotodama
directories:
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"
mac:
  # 「-」は簡易署名（ad-hoc）。Developer ID が無くても Info.plist を署名に結び、
  # プロセスを Electron ではなく Kotodama として macOS の許可対象にする。
  # 環境変数 CSC_IDENTITY は electron-builder 26 では読まれない。
  identity: "-"
  forceCodeSigning: true
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleDisplayName: Kotodama
    NSMicrophoneUsageDescription: 音声入力のためマイクを使用します
    NSAppleEventsUsageDescription: 文字をカーソル位置に貼り付けるためにキー操作を送出します
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
